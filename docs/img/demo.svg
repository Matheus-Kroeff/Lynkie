<text x="22" y="70" class="p l0" xml:space="preserve">$ ./programa.exe</text><text x="22" y="92" class="h l1" xml:space="preserve">   LYNKIE - Recomendacao de Jogos Indies por Similaridade</text><text x="22" y="114" class="i l2" xml:space="preserve">Escolha uma opcao: 1</text><text x="22" y="136" class="o l3" xml:space="preserve">Arquivo lido com sucesso! Vertices: 163 | Arestas validas: 4947</text><text x="22" y="158" class="i l4" xml:space="preserve">Escolha uma opcao: 11</text><text x="22" y="180" class="i l5" xml:space="preserve">Digite o ID do jogo escolhido (0 a 162): 0</text><text x="22" y="202" class="h l6" xml:space="preserve"> RECOMENDACOES PARA: Supipara - Chapter 1 Spring Has Come!</text><text x="22" y="224" class="o l7" xml:space="preserve"> -&gt; Foto Flash 2 | Similaridade: 28%</text><text x="22" y="246" class="o l8" xml:space="preserve"> -&gt; OMNIMUS | Similaridade: 25%</text><text x="22" y="268" class="o l9" xml:space="preserve"> -&gt; Cicadas - The IQA Edition | Similaridade: 25%</text><text x="22" y="290" class="o l10" xml:space="preserve"> -&gt; Evan's Remains | Similaridade: 20%</text><text x="22" y="312" class="i l11" xml:space="preserve">Escolha uma opcao: 17</text><text x="22" y="334" class="h l12" xml:space="preserve">=== Percurso Euleriano ===</text><text x="22" y="356" class="o l13" xml:space="preserve">Vertices de grau impar: 70</text><text x="22" y="378" class="w l14" xml:space="preserve">NAO admite percurso euleriano (mais de 2 vertices de grau impar).</text><text x="22" y="400" class="i l15" xml:space="preserve">Escolha uma opcao: 0</text><text x="22" y="422" class="h l16" xml:space="preserve">   Developed by: Andre D. Duarte | Matheus L. C. Kroeff | Naoto Ushizaki</text>
